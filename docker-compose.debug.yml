services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: gloan-debug
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./server.py:/app/server.py
      - ./gloan:/app/gloan
      - ./static:/app/static
      - ./tools:/app/tools
      - ./tests:/app/tests
      - ./index.html:/app/index.html
      - ./data:/data
    environment:
      - GLOAN_PASSWORD=debugpassword
      - PYTHONUNBUFFERED=1
