services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: gloan-debug
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./server.py:/app/server.py
      - ./gloan:/app/gloan
      - ./static:/app/static
      - ./tools:/app/tools
      - ./tests:/app/tests
      - ./index.html:/app/index.html
      - ./data:/data
      # Uncomment to mount local TLS certs (e.g. generated with mkcert) for local HTTPS testing:
      - ./certs:/certs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GLOAN_SSL_AUTO=1
      - GLOAN_SSL_CERT=${GLOAN_SSL_CERT:-}
      - GLOAN_SSL_KEY=${GLOAN_SSL_KEY:-}
